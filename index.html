<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備品管理システム（完全版）</title>
  
  <!-- Tailwind CSS (デザイン) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QRCode.js (棚QRコード生成) -->
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- Quagga2 (バーコード読み取り) -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    #interactive.viewport video {
      width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }
    #interactive.viewport canvas {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

  <!-- ヘッダー -->
  <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <span>📦</span> 備品管理システム
      </h1>
      <div id="connection-status" class="text-xs bg-emerald-800 px-2 py-1 rounded border border-emerald-500">
        ローカル動作中
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- モード切替タブ -->
    <div class="flex bg-gray-200 p-1 rounded-xl">
      <button id="tab-pc" onclick="switchTab('pc')" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all bg-white text-emerald-800 shadow">
        💻 PC画面（親：管理）
      </button>
      <button id="tab-mobile" onclick="switchTab('mobile')" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all text-gray-600">
        📱 スマホ画面（弟子：現場）
      </button>
    </div>

    <!-- ==================== PC画面（親） ==================== -->
    <div id="view-pc" class="space-y-6">

      <!-- 1. マスター登録カード -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
          <span>📝</span> 備品マスター登録
        </h2>
        <form id="add-form" onsubmit="handleAddItem(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">備品名 *</label>
            <input type="text" id="input-name" required placeholder="例：洗剤、ティッシュ" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ</label>
              <select id="input-category" class="w-full border p-2.5 rounded-lg text-sm bg-white">
                <option>日用品</option>
                <option>文房具</option>
                <option>掃除用品</option>
                <option>食品・飲料</option>
                <option>その他</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">保管場所</label>
              <input type="text" id="input-location" placeholder="例：2F 納戸" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">バーコード(JAN) ※任意</label>
            <div class="flex gap-2">
              <input type="text" id="input-barcode" placeholder="スキャンまたは手入力" class="w-full border p-2.5 rounded-lg text-sm font-mono">
              <button type="button" onclick="startBarcodeScan('input-barcode')" class="bg-gray-700 text-white px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap hover:bg-gray-800">
                📷 スキャン
              </button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">初期在庫数</label>
              <input type="number" id="input-stock" value="1" min="0" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">発注ライン（この数以下で警告）</label>
              <input type="number" id="input-threshold" value="1" min="0" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-sm transition-all mt-2">
            ＋ 備品をリストに追加する
          </button>
        </form>
      </div>

      <!-- 2. 保管場所(棚)用 QRコード発行 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
          <span>🏷️</span> 保管場所(棚)用 QRコード発行
        </h2>
        <p class="text-xs text-gray-500 mb-3">棚や引き出しに貼り付ける用のQRコードを発行します。</p>
        <div class="flex gap-2 mb-3">
          <input type="text" id="qr-location-input" placeholder="例：洗面台下" class="flex-1 border p-2.5 rounded-lg text-sm">
          <button onclick="generateLocationQR()" class="bg-emerald-800 hover:bg-emerald-900 text-white font-bold px-4 py-2.5 rounded-lg text-sm whitespace-nowrap">
            QRコード生成
          </button>
        </div>
        <div id="qr-result-area" class="hidden text-center p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
          <div id="qrcode-canvas" class="flex justify-center mb-2"></div>
          <p id="qr-location-label" class="font-bold text-gray-700 text-sm mb-3"></p>
          <button onclick="window.print()" class="bg-gray-800 text-white text-xs px-4 py-2 rounded-lg font-bold hover:bg-black">
            𖤂 棚札として印刷
          </button>
        </div>
      </div>

      <!-- 3. 発注が必要な備品（アラート） -->
      <div id="alert-card" class="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl hidden">
        <h3 class="font-bold text-amber-800 text-sm mb-2 flex items-center gap-1">
          <span>⚠️</span> 在庫不足（要発注）
        </h3>
        <ul id="alert-list" class="space-y-1 text-xs text-amber-900 font-bold"></ul>
      </div>

    </div>

    <!-- ==================== スマホ画面（弟子） ==================== -->
    <div id="view-mobile" class="space-y-4">

      <!-- スキャナー起動カード -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 text-center space-y-3">
        <button onclick="startBarcodeScan()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base">
          <span class="text-xl">📷</span> バーコード / 棚QRをスキャン
        </button>
        <p class="text-xs text-gray-400">※商品のバーコード、または棚のQRコードにかざしてください</p>
      </div>

      <!-- フィルター状態（棚QRで絞り込んだ時） -->
      <div id="filter-banner" class="hidden bg-emerald-100 border border-emerald-300 p-3 rounded-xl flex justify-between items-center">
        <span class="text-xs font-bold text-emerald-800" id="filter-banner-text">📍 保管場所で絞り込み中</span>
        <button onclick="clearFilter()" class="text-xs bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-bold">
          解除
        </button>
      </div>

      <!-- カメラ映像エリア -->
      <div id="scanner-container" class="hidden bg-black p-2 rounded-2xl relative">
        <div id="interactive" class="viewport"></div>
        <button onclick="stopBarcodeScan()" class="mt-2 w-full bg-red-600 text-white font-bold py-2 rounded-lg text-xs">
          ✕ カメラを閉じる
        </button>
      </div>

    </div>

    <!-- ==================== 共通：在庫一覧リスト ==================== -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
          <span>📋</span> 在庫一覧
        </h2>
        <span id="item-count" class="text-xs bg-gray-100 text-gray-600 font-bold px-2.5 py-1 rounded-full">
          0件
        </span>
      </div>

      <div id="inventory-list" class="space-y-3">
        <!-- JSで動的に追加されます -->
      </div>
    </div>

  </main>

  <script>
    // App State
    let items = [];
    let activeFilterLocation = null;
    let targetScanInputId = null;

    // 初期化
    window.onload = function() {
      loadData();
      renderItems();
    };

    // タブ切り替え
    function switchTab(tab) {
      const pcView = document.getElementById('view-pc');
      const mobileView = document.getElementById('view-mobile');
      const tabPc = document.getElementById('tab-pc');
      const tabMobile = document.getElementById('tab-mobile');

      if (tab === 'pc') {
        pcView.classList.remove('hidden');
        mobileView.classList.add('hidden');
        tabPc.className = "flex-1 py-2 rounded-lg font-bold text-sm transition-all bg-white text-emerald-800 shadow";
        tabMobile.className = "flex-1 py-2 rounded-lg font-bold text-sm transition-all text-gray-600";
      } else {
        pcView.classList.add('hidden');
        mobileView.classList.remove('hidden');
        tabMobile.className = "flex-1 py-2 rounded-lg font-bold text-sm transition-all bg-white text-emerald-800 shadow";
        tabPc.className = "flex-1 py-2 rounded-lg font-bold text-sm transition-all text-gray-600";
      }
    }

    // データ保存・読み込み
    function saveData() {
      localStorage.setItem('stock_items', JSON.stringify(items));
      renderItems();
    }

    function loadData() {
      const saved = localStorage.getItem('stock_items');
      if (saved) {
        items = JSON.parse(saved);
      } else {
        items = [
          { id: '1', name: 'ハンドソープ', category: '日用品', location: '洗面台下', barcode: '', stock: 2, threshold: 1 },
          { id: '2', name: 'BOXティッシュ', category: '日用品', location: '2F 納戸', barcode: '', stock: 0, threshold: 2 }
        ];
        saveData();
      }
    }

    // 備品追加処理
    function handleAddItem(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now().toString(),
        name: document.getElementById('input-name').value,
        category: document.getElementById('input-category').value,
        location: document.getElementById('input-location').value || '未設定',
        barcode: document.getElementById('input-barcode').value.trim(),
        stock: parseInt(document.getElementById('input-stock').value) || 0,
        threshold: parseInt(document.getElementById('input-threshold').value) || 0
      };

      items.unshift(newItem);
      saveData();
      document.getElementById('add-form').reset();
      alert('備品を追加しました！');
    }

    // 在庫増減
    function updateStock(id, delta) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.stock = Math.max(0, item.stock + delta);
        saveData();
      }
    }

    // 削除
    function deleteItem(id) {
      if (confirm('この備品を削除しますか？')) {
        items = items.filter(i => i.id !== id);
        saveData();
      }
    }

    // 棚QRコード生成処理
    function generateLocationQR() {
      const locationName = document.getElementById('qr-location-input').value.trim();
      if (!locationName) {
        alert('保管場所の名前を入力してください（例：洗面台下）');
        return;
      }

      const qrContainer = document.getElementById('qrcode-canvas');
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: `LOC:${locationName}`,
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById('qr-location-label').innerText = `📍 保管場所：${locationName}`;
      document.getElementById('qr-result-area').classList.remove('hidden');
    }

    // 画面再描画
    function renderItems() {
      const listEl = document.getElementById('inventory-list');
      listEl.innerHTML = '';

      let displayItems = items;
      if (activeFilterLocation) {
        displayItems = items.filter(i => i.location === activeFilterLocation);
      }

      document.getElementById('item-count').innerText = `${displayItems.length}件`;

      if (displayItems.length === 0) {
        listEl.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">該当する備品がありません</p>`;
      } else {
        displayItems.forEach(item => {
          const isLow = item.stock <= item.threshold;
          const card = document.createElement('div');
          card.className = `p-3.5 rounded-xl border ${isLow ? 'bg-red-50/50 border-red-200' : 'bg-gray-50 border-gray-200'} flex justify-between items-center`;

          card.innerHTML = `
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-bold text-gray-800 text-sm">${item.name}</span>
                <span class="text-[10px] bg-white border border-gray-300 text-gray-600 px-1.5 py-0.5 rounded font-medium">${item.category}</span>
              </div>
              <div class="text-xs text-gray-500 flex items-center gap-3">
                <span>📍 ${item.location}</span>
                ${item.barcode ? `<span class="font-mono text-[10px] bg-gray-200 px-1 rounded">JAN: ${item.barcode}</span>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div class="flex items-center bg-white border border-gray-300 rounded-lg shadow-sm">
                <button onclick="updateStock('${item.id}', -1)" class="w-8 h-8 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-100 rounded-l-lg active:bg-gray-200">-</button>
                <span class="w-8 text-center font-bold text-sm ${isLow ? 'text-red-600 font-black' : 'text-gray-800'}">${item.stock}</span>
                <button onclick="updateStock('${item.id}', 1)" class="w-8 h-8 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-100 rounded-r-lg active:bg-gray-200">+</button>
              </div>
              <button onclick="deleteItem('${item.id}')" class="text-gray-300 hover:text-red-500 p-1 text-xs">✕</button>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      const lowStockItems = items.filter(i => i.stock <= i.threshold);
      const alertCard = document.getElementById('alert-card');
      const alertList = document.getElementById('alert-list');

      if (lowStockItems.length > 0) {
        alertCard.classList.remove('hidden');
        alertList.innerHTML = lowStockItems.map(i => `<li>• ${i.name}（残り ${i.stock} 個 / 📍 ${i.location}）</li>`).join('');
      } else {
        alertCard.classList.add('hidden');
      }
    }

    // 絞り込み解除
    function clearFilter() {
      activeFilterLocation = null;
      document.getElementById('filter-banner').classList.add('hidden');
      renderItems();
    }

    // ==================== カメラ・バーコードスキャン処理（エラー対策修正版） ====================
    function startBarcodeScan(inputId = null) {
      targetScanInputId = inputId;
      document.getElementById('scanner-container').classList.remove('hidden');

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: { ideal: "environment" } // 端末環境に合わせてカメラを最適化
          },
        },
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "code_128_reader", "qr_reader"]
        }
      }, function(err) {
        if (err) {
          console.error(err);
          alert('カメラの起動に失敗しました。\n\n【確認事項】\n1. スマホの「設定」でSafari/Chromeへのカメラ許可がONになっているか確認してください。\n2. LINEなどの内蔵ブラウザではなく、SafariやChromeアプリ単体でページを開き直してください。');
          document.getElementById('scanner-container').classList.add('hidden');
          return;
        }
        Quagga.start();
      });
    }

    function stopBarcodeScan() {
      Quagga.stop();
      document.getElementById('scanner-container').classList.add('hidden');
    }

    // スキャン検出時
    Quagga.onDetected(function(result) {
      const code = result.codeResult.code;
      if (!code) return;

      stopBarcodeScan();

      if (targetScanInputId) {
        document.getElementById(targetScanInputId).value = code;
        targetScanInputId = null;
        alert(`バーコードを読み取りました: ${code}`);
        return;
      }

      if (code.startsWith('LOC:')) {
        const location = code.replace('LOC:', '');
        activeFilterLocation = location;
        document.getElementById('filter-banner-text').innerText = `📍 保管場所『${location}』の備品に絞り込みました！`;
        document.getElementById('filter-banner').classList.remove('hidden');
        renderItems();
        return;
      }

      const hitItem = items.find(i => i.barcode === code);
      if (hitItem) {
        hitItem.stock += 1;
        saveData();
        alert(`「${hitItem.name}」の在庫を +1 しました！（現在: ${hitItem.stock}個）`);
      } else {
        alert(`該当する備品が見つかりませんでした。(JAN: ${code})`);
      }
    });
  </script>
</body>
</html>
