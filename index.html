<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備品管理システム（ハイライト表示対応版）</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js (QR生成) -->
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- html5-qrcode (カメラライブラリ) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    /* スキャンされたアイテムを強調するアニメーション */
    @keyframes highlightPulse {
      0% { background-color: #fef08a; border-color: #eab308; transform: scale(1.02); }
      50% { background-color: #fef9c3; border-color: #eab308; }
      100% { background-color: transparent; transform: scale(1); }
    }
    .highlight-item {
      animation: highlightPulse 2.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

  <!-- ヘッダー -->
  <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <span>📦</span> 備品管理システム
      </h1>
      <span id="sync-status" class="text-xs bg-emerald-800 px-2 py-1 rounded border border-emerald-500">
        🔄 読込中...
      </span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- モード切替タブ -->
    <div class="flex bg-gray-200 p-1 rounded-xl">
      <button id="tab-pc" onclick="switchTab('pc')" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all bg-white text-emerald-800 shadow">
        💻 PC画面（親：管理）
      </button>
      <button id="tab-mobile" onclick="switchTab('mobile')" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all text-gray-600">
        📱 スマホ画面（弟子：現場）
      </button>
    </div>

    <!-- ==================== PC画面（親） ==================== -->
    <div id="view-pc" class="space-y-6">

      <!-- 1. マスター登録カード -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
          <span>📝</span> 備品マスター登録
        </h2>
        <form id="add-form" onsubmit="handleAddItem(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">備品名 *</label>
            <input type="text" id="input-name" required placeholder="例：風邪薬、目薬、ティッシュ" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ</label>
              <select id="input-category" class="w-full border p-2.5 rounded-lg text-sm bg-white">
                <option>日用品</option>
                <option>文房具</option>
                <option>医薬品</option>
                <option>食品・飲料</option>
                <option>その他</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">保管場所</label>
              <input type="text" id="input-location" placeholder="例：薬箱、救急箱" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">バーコード(JAN) ※任意</label>
            <div class="flex gap-2">
              <input type="text" id="input-barcode" placeholder="数字を手入力 または 右ボタンでスキャン" class="flex-1 border p-2.5 rounded-lg text-sm font-mono">
              <button type="button" onclick="startCameraForInput()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2.5 rounded-lg text-xs whitespace-nowrap flex items-center gap-1">
                <span>📷</span> カメラで読取
              </button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">初期在庫数</label>
              <input type="number" id="input-stock" value="1" min="0" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">発注ライン</label>
              <input type="number" id="input-threshold" value="1" min="0" class="w-full border p-2.5 rounded-lg text-sm">
            </div>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-sm transition-all mt-2">
            ＋ 備品をリストに追加する
          </button>
        </form>
      </div>

      <!-- 2. QRコード（棚札・荷札）発行 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span>🏷️</span> QRコード発行（棚札・荷札）
        </h2>
        
        <!-- A. 保管場所(棚札)発行 -->
        <div class="border-t pt-3">
          <label class="block text-xs font-bold text-emerald-800 mb-1">📍 保管場所（棚札）用</label>
          <div class="flex gap-2">
            <input type="text" id="qr-location-input" placeholder="例：薬箱、洗面台下" class="flex-1 border p-2.5 rounded-lg text-sm">
            <button onclick="generateLocationQR()" class="bg-emerald-800 hover:bg-emerald-900 text-white font-bold px-3 py-2.5 rounded-lg text-xs whitespace-nowrap">
              棚QR生成
            </button>
          </div>
        </div>

        <!-- B. 備品(荷札)発行 -->
        <div class="border-t pt-3">
          <label class="block text-xs font-bold text-emerald-800 mb-1">🏷️ 備品（荷札）用</label>
          <div class="flex gap-2">
            <select id="qr-item-select" class="flex-1 border p-2.5 rounded-lg text-sm bg-white">
              <option value="">備品を選択してください</option>
            </select>
            <button onclick="generateItemQR()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2.5 rounded-lg text-xs whitespace-nowrap">
              荷札QR生成
            </button>
          </div>
        </div>

        <!-- QR出力エリア -->
        <div id="qr-result-area" class="hidden text-center p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
          <div id="qrcode-canvas" class="flex justify-center mb-2"></div>
          <p id="qr-location-label" class="font-bold text-gray-700 text-sm mb-3"></p>
          <button onclick="window.print()" class="bg-gray-800 text-white text-xs px-4 py-2 rounded-lg font-bold hover:bg-black">
            𖤂 印刷する
          </button>
        </div>
      </div>

    </div>

    <!-- ==================== スマホ画面（弟子） ==================== -->
    <div id="view-mobile" class="space-y-4">

      <!-- スキャナー起動カード -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 text-center space-y-3">
        <button onclick="startCamera('inventory')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base">
          <span class="text-xl">📷</span> バーコード / 棚QR / 荷札QR スキャン
        </button>
        <p class="text-xs text-gray-400">※スキャンした備品は一番上になり、ハイライトされます</p>
      </div>

      <!-- フィルター表示 -->
      <div id="filter-banner" class="hidden bg-emerald-100 border border-emerald-300 p-3 rounded-xl flex justify-between items-center">
        <span class="text-xs font-bold text-emerald-800" id="filter-banner-text">📍 保管場所で絞り込み中</span>
        <button onclick="clearFilter()" class="text-xs bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-bold">
          解除
        </button>
      </div>

    </div>

    <!-- 共通カメラ枠モーダル -->
    <div id="camera-modal" class="hidden bg-black p-3 rounded-2xl sticky bottom-4 z-50">
      <div id="reader" class="w-full overflow-hidden rounded-xl"></div>
      <button onclick="stopCamera()" class="mt-3 w-full bg-red-600 text-white font-bold py-3 rounded-xl text-sm">
        ✕ カメラを閉じる
      </button>
    </div>

    <!-- ==================== 共通：在庫一覧リスト ==================== -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
          <span>📋</span> 在庫一覧
        </h2>
        <button onclick="fetchDataFromSheet()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-2.5 py-1 rounded-lg border border-gray-300">
          🔄 手動更新
        </button>
      </div>
      <div id="inventory-list" class="space-y-3"></div>
    </div>

  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwEdIKJzc7r20JTUMvlfRViQodZ9lhMl0nmWg9c87Djs7LbPVu7g2XFKffpxOLGDTqAiw/exec";

    let items = [];
    let activeFilterLocation = null;
    let html5QrcodeScanner = null;
    let scanMode = 'inventory';
    let highlightedItemId = null; // 直前にスキャンして強調表示するID

    window.onload = function() {
      fetchDataFromSheet();
    };

    function setStatus(msg, isError = false) {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = msg;
      if (isError) {
        statusEl.className = "text-xs bg-red-800 px-2 py-1 rounded border border-red-500";
      } else {
        statusEl.className = "text-xs bg-emerald-800 px-2 py-1 rounded border border-emerald-500";
      }
    }

    async function fetchDataFromSheet() {
      setStatus("🔄 読み込み中...");
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        items = data;
        renderItems();
        updateItemDropdown();
        setStatus("🟢 同期完了");
      } catch (err) {
        console.error(err);
        setStatus("⚠️ 同期エラー", true);
      }
    }

    async function syncDataToSheet() {
      setStatus("⏳ 保存中...");
      renderItems();
      updateItemDropdown();
      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(items)
        });
        setStatus("🟢 同期完了");
      } catch (err) {
        console.error(err);
        setStatus("⚠️ 保存エラー", true);
      }
    }

    function switchTab(tab) {
      const pcView = document.getElementById('view-pc');
      const mobileView = document.getElementById('view-mobile');
      const tabPc = document.getElementById('tab-pc');
      const tabMobile = document.getElementById('tab-mobile');

      if (tab === 'pc') {
        pcView.classList.remove('hidden');
        mobileView.classList.add('hidden');
        tabPc.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-emerald-800 shadow";
        tabMobile.className = "flex-1 py-2 rounded-lg font-bold text-sm text-gray-600";
      } else {
        pcView.classList.add('hidden');
        mobileView.classList.remove('hidden');
        tabMobile.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-emerald-800 shadow";
        tabPc.className = "flex-1 py-2 rounded-lg font-bold text-sm text-gray-600";
      }
    }

    function handleAddItem(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now().toString(),
        name: document.getElementById('input-name').value,
        category: document.getElementById('input-category').value,
        location: document.getElementById('input-location').value || '未設定',
        barcode: document.getElementById('input-barcode').value.trim(),
        stock: parseInt(document.getElementById('input-stock').value) || 0,
        threshold: parseInt(document.getElementById('input-threshold').value) || 0
      };
      items.unshift(newItem);
      highlightedItemId = newItem.id;
      syncDataToSheet();
      document.getElementById('add-form').reset();
      alert('備品を追加し、スプレッドシートに保存しました！');
    }

    function updateStock(id, delta) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.stock = Math.max(0, item.stock + delta);
        syncDataToSheet();
      }
    }

    function deleteItem(id) {
      if (confirm('削除しますか？')) {
        items = items.filter(i => i.id !== id);
        syncDataToSheet();
      }
    }

    function updateItemDropdown() {
      const select = document.getElementById('qr-item-select');
      select.innerHTML = '<option value="">備品を選択してください</option>';
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.innerText = `${item.name} (${item.location})`;
        select.appendChild(opt);
      });
    }

    // 📍 棚QRコード生成
    function generateLocationQR() {
      const locationName = document.getElementById('qr-location-input').value.trim();
      if (!locationName) return alert('保管場所の名前を入力してください');

      const qrContainer = document.getElementById('qrcode-canvas');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: `L:${locationName}`,
        width: 180, height: 180,
        correctLevel: QRCode.CorrectLevel.L
      });
      document.getElementById('qr-location-label').innerText = `📍 保管場所（棚札）：${locationName}`;
      document.getElementById('qr-result-area').classList.remove('hidden');
    }

    // 🏷️ 備品（荷札）QRコード生成
    function generateItemQR() {
      const selectedId = document.getElementById('qr-item-select').value;
      if (!selectedId) return alert('荷札を発行する備品を選択してください');

      const item = items.find(i => i.id === selectedId);
      if (!item) return;

      const qrContainer = document.getElementById('qrcode-canvas');
      qrContainer.innerHTML = '';
      
      const qrData = item.barcode ? item.barcode : `I:${item.id}`;

      new QRCode(qrContainer, {
        text: qrData,
        width: 180, height: 180,
        correctLevel: QRCode.CorrectLevel.L
      });
      document.getElementById('qr-location-label').innerText = `🏷️ 荷札：${item.name} (${item.category})`;
      document.getElementById('qr-result-area').classList.remove('hidden');
    }

    function renderItems() {
      const listEl = document.getElementById('inventory-list');
      listEl.innerHTML = '';

      let displayItems = activeFilterLocation ? items.filter(i => i.location === activeFilterLocation) : items;

      if (displayItems.length === 0) {
        listEl.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">備品データがありません</p>`;
        return;
      }

      displayItems.forEach(item => {
        const isLow = Number(item.stock) <= Number(item.threshold);
        const isHighlighted = item.id === highlightedItemId;
        
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border transition-all duration-300 ${
          isHighlighted ? 'highlight-item border-yellow-500 shadow-md' :
          isLow ? 'bg-red-50/50 border-red-200' : 'bg-gray-50 border-gray-200'
        } flex justify-between items-center`;

        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-gray-800 text-sm">${item.name}</span>
              <span class="text-[10px] bg-white border px-1.5 py-0.5 rounded text-gray-600">${item.category}</span>
              ${isHighlighted ? '<span class="text-[10px] bg-yellow-400 text-yellow-950 font-bold px-1.5 py-0.5 rounded shadow-sm">スキャン品</span>' : ''}
            </div>
            <div class="text-xs text-gray-500">📍 ${item.location} ${item.barcode ? `| JAN: ${item.barcode}` : ''}</div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-center bg-white border rounded-lg shadow-sm">
              <button onclick="updateStock('${item.id}', -1)" class="w-8 h-8 font-bold text-gray-600 hover:bg-gray-100 rounded-l-lg">-</button>
              <span class="w-8 text-center font-bold text-sm ${isLow ? 'text-red-600' : 'text-gray-800'}">${item.stock}</span>
              <button onclick="updateStock('${item.id}', 1)" class="w-8 h-8 font-bold text-gray-600 hover:bg-gray-100 rounded-r-lg">+</button>
            </div>
            <button onclick="deleteItem('${item.id}')" class="text-gray-300 hover:text-red-500 p-1 text-xs">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function clearFilter() {
      activeFilterLocation = null;
      document.getElementById('filter-banner').classList.add('hidden');
      renderItems();
    }

    function startCameraForInput() {
      startCamera('input');
    }

    // ---------------- カメラ起動処理 ----------------
    function startCamera(mode = 'inventory') {
      scanMode = mode;
      document.getElementById('camera-modal').classList.remove('hidden');

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      const config = {
        fps: 15,
        qrbox: { width: 260, height: 180 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        Html5Qrcode.getCameras().then(cameras => {
          if (cameras && cameras.length) {
            const cameraId = cameras[cameras.length - 1].id;
            html5QrcodeScanner.start(cameraId, config, onScanSuccess);
          }
        }).catch(e => {
          alert("カメラの起動に失敗しました。カメラへのアクセス許可をご確認ください。");
          stopCamera();
        });
      });
    }

    function stopCamera() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('camera-modal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('camera-modal').classList.add('hidden');
        });
      } else {
        document.getElementById('camera-modal').classList.add('hidden');
      }
    }

    // ---------------- スキャン成功時の処理 ----------------
    function onScanSuccess(decodedText) {
      stopCamera();
      const text = decodedText.trim();

      // モードA: PCのフォームに入力する場合
      if (scanMode === 'input') {
        document.getElementById('input-barcode').value = text;
        alert(`バーコード（${text}）を入力欄に読み込みました！`);
        return;
      }

      // モードB: スマホ画面で在庫操作や棚絞り込みを行う場合
      if (/^(L:|LOC:)/i.test(text)) {
        const location = text.replace(/^(L:|LOC:)/i, '');
        activeFilterLocation = location;
        document.getElementById('filter-banner-text').innerText = `📍 保管場所『${location}』の備品に絞り込みました！`;
        document.getElementById('filter-banner').classList.remove('hidden');
        renderItems();
        return;
      }

      let hitIndex = -1;
      if (/^(I:|ITEM:)/i.test(text)) {
        const itemId = text.replace(/^(I:|ITEM:)/i, '');
        hitIndex = items.findIndex(i => i.id === itemId);
      } else {
        hitIndex = items.findIndex(i => String(i.barcode) === String(text));
      }

      if (hitIndex !== -1) {
        // 1. 該当アイテムの在庫を +1
        const hitItem = items[hitIndex];
        hitItem.stock = Number(hitItem.stock) + 1;
        
        // 2. 配列から一旦取り出して「配列の一番最初(先頭)」に挿入！
        items.splice(hitIndex, 1);
        items.unshift(hitItem);

        // 3. ハイライト表示のフラグを設定
        highlightedItemId = hitItem.id;

        // 4. 同期と描画
        syncDataToSheet();

        // 2.5秒後にハイライト解除用の更新（アニメーション終了後）
        setTimeout(() => {
          if (highlightedItemId === hitItem.id) {
            highlightedItemId = null;
            renderItems();
          }
        }, 2500);

      } else {
        alert(`未登録のバーコードです (JAN: ${text})\nPC画面の「備品マスター登録」から新規登録を行ってください。`);
      }
    }
  </script>
</body>
</html>
